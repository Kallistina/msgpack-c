name: LibFuzzer CI

on: [push]

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/kallistina/msgpack-c:${{ github.sha }} \
            -t ghcr.io/kallistina/msgpack-c:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/kallistina/msgpack-c:${{ github.sha }}
          docker push ghcr.io/kallistina/msgpack-c:latest

      - name: Run 10-minute fuzzing campaign
        run: |
          mkdir -p ${{ github.workspace }}/fuzzing-output
          docker run --rm \
            -v ${{ github.workspace }}/fuzzing-output:/fuzzing-output \
            ghcr.io/kallistina/msgpack-c:${{ github.sha }}

      - name: Upload fuzzing output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-output-${{ github.sha }}
          path: ${{ github.workspace }}/fuzzing-output/
          compression-level: 9
